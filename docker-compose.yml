version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: cipher-sentinel-api
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend
      - ./core:/app/core
      - ./pcap_samples:/app/pcap_samples
    env_file:
      - backend/.env
    environment:
      - PYTHONPATH=/app
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - sentinel-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cipher-sentinel-ui
    ports:
      - "3000:3000"
    volumes:
      - ./frontend/src:/app/src
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - sentinel-net

  redis:
    image: redis:7-alpine
    container_name: cipher-sentinel-redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    networks:
      - sentinel-net

networks:
  sentinel-net:
    driver: bridge
